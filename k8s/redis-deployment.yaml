apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: banking
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
        app: redis  
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10
          ports:
            - containerPort: 6379