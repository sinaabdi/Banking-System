apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: banking
  name: fx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fx
  template:
    metadata:
      labels:
        app: fx
    spec:
      containers:
        - name: fx
          image: ghcr.io/sinaabdi/fx-service:de2bb56ed1de8e9b1ebd65cd277b0d8dbc5aed1c
          ports:
            - containerPort: 9092
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  key: REDIS_HOST
                  name: banking-config
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  key: REDIS_PORT
                  name: banking-config

    