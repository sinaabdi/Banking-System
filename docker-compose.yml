version: '3.8'

services:
  postgres:
    image: postgres:18
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=core_banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/

volumes:
    postgres_data: