apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: banking
  name: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: banking-notification:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
            