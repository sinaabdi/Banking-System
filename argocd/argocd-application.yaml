apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: banking-system
spec:
  project: default
  source:
    repoURL: https://github.com/sinaabdi/Banking-System.git
    targetRevision: gitops-dev
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true