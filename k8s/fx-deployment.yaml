apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: banking
  name: fx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx
  template:
    metadata:
      labels:
        app: fx
    spec:
      containers:
        - name: fx
          image: ghcr.io/sinaabdi/fx-service:9982b86ae628fed3775430532d160227c0d6af85
          ports:
            - containerPort: 9092

    