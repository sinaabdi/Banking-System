version: '3.8'

services:
  core:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./banking
      dockerfile: Dockerfile
    env_file:
      - ".env"
    ports:
      - "8080:8080"
    networks:
      - backend

  postgres:
    image: postgres:18
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=core_banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    networks:
      - backend

volumes:
    postgres_data:

networks:
  backend:
    driver: bridge