version: '3.8'

services:
  core:
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: ./banking
      dockerfile: Dockerfile
    env_file:
      - ".env"
    ports:
      - "8080:8080"
    networks:
      - backend

  postgres:
    image: postgres:18
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=core_banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    env_file:
      - ".env"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - backend

volumes:
    postgres_data:

networks:
  backend:
    driver: bridge